        fill: #737373;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>
  <!-- 2R Mark -->
  <text x="0" y="48" class="logo-2r">2R</text>
  
  <!-- CREATIONS -->
  <text x="84" y="37" class="logo-creations">CREATIONS</text>
  
  <!-- PROFESSIONAL WEDDING ALBUM DESIGNER -->
  <text x="86" y="58" class="logo-tagline">PROFESSIONAL WEDDING ALBUM DESIGNER</text>
</svg>