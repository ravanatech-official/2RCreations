name: Deploy 2R Creations Backend & Web to Google Cloud Run (Zero-Cost Scale-to-Zero)

on:
  workflow_dispatch:

jobs:
  deploy_cloud_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub Secrets and Variables
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          GCP_SA_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_SA_CREDS" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_RAVANATEK (or GCP_SA_KEY) secret in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "::error::Missing VITE_FIREBASE_API_KEY or VITE_FIREBASE_APP_ID in GitHub Repository Variables/Secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Gemini API key secret to Secret Manager (only if changed, keeps 1 active version)
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY_SECRET" ]; then
            echo "No GEMINI_API_KEY secret in GitHub; Cloud Run will continue using existing 2rcreations-gemini-api-key:latest in Secret Manager."
            exit 0
          fi

          gcloud secrets create 2rcreations-gemini-api-key \
            --replication-policy="automatic" \
            --project=ravanatek 2>/dev/null || true

          NEW_HASH=$(printf '%s' "$GEMINI_API_KEY_SECRET" | sha256sum | awk '{print $1}')
          CURRENT_VER=$(gcloud secrets versions list 2rcreations-gemini-api-key --project=ravanatek --filter="state=ENABLED" --sort-by="~createTime" --limit=1 --format="value(name)" 2>/dev/null || true)
          CURRENT_HASH=""
          if [ -n "$CURRENT_VER" ]; then
            CURRENT_HASH=$(gcloud secrets versions access latest --secret=2rcreations-gemini-api-key --project=ravanatek 2>/dev/null | sha256sum | awk '{print $1}' || true)
          fi

          if [ "$NEW_HASH" = "$CURRENT_HASH" ]; then
            echo "Secret Manager 2rcreations-gemini-api-key already matches GitHub GEMINI_API_KEY (0 new versions created)."
          else
            printf '%s' "$GEMINI_API_KEY_SECRET" | gcloud secrets versions add 2rcreations-gemini-api-key \
              --data-file=- \
              --project=ravanatek >/dev/null
            if [ -n "$CURRENT_VER" ]; then
              OLD_ID="${CURRENT_VER##*/}"
              gcloud secrets versions disable "$OLD_ID" --secret=2rcreations-gemini-api-key --project=ravanatek --quiet || true
            fi
            echo "Updated 2rcreations-gemini-api-key and disabled prior version to remain within free-tier version limits."
          fi

      - name: Build and push container to Artifact Registry
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://2rcreations.web.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'ravanatek.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'ravanatek' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'ravanatek.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '939944415589' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || 'G-BLSD8WXRRN' }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || 'two-r-creations-db' }}
          VITE_FIRESTORE_COLLECTION_PREFIX: ${{ vars.VITE_FIRESTORE_COLLECTION_PREFIX || '' }}
          VITE_ENABLE_MARKETPLACE: ${{ vars.VITE_ENABLE_MARKETPLACE || 'false' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/ravanatek/cloud-run-source-deploy/two-r-creations-web:${{ github.sha }}"
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build \
            --build-arg VITE_APP_URL="$VITE_APP_URL" \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_FIREBASE_STORAGE_BUCKET" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_FIREBASE_APP_ID" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="$VITE_FIREBASE_MEASUREMENT_ID" \
            --build-arg VITE_FIREBASE_DATABASE_ID="$VITE_FIREBASE_DATABASE_ID" \
            --build-arg VITE_FIRESTORE_COLLECTION_PREFIX="$VITE_FIRESTORE_COLLECTION_PREFIX" \
            --build-arg VITE_ENABLE_MARKETPLACE="$VITE_ENABLE_MARKETPLACE" \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy strictly to isolated Cloud Run service (two-r-creations-web)
        env:
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || 'two-r-creations-db' }}
          VITE_FIRESTORE_COLLECTION_PREFIX: ${{ vars.VITE_FIRESTORE_COLLECTION_PREFIX || '' }}
          ENABLE_MARKETPLACE: ${{ vars.ENABLE_MARKETPLACE || 'false' }}
          ENABLE_GEMINI_AI: ${{ vars.ENABLE_GEMINI_AI || 'false' }}
          CLOUD_RUN_SA: ${{ vars.CLOUD_RUN_SA || 'tworcreations-backend-sa@ravanatek.iam.gserviceaccount.com' }}
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/ravanatek/cloud-run-source-deploy/two-r-creations-web:${{ github.sha }}"
          gcloud run deploy two-r-creations-web \
            --project ravanatek \
            --region asia-southeast1 \
            --image "$IMAGE" \
            --service-account "$CLOUD_RUN_SA" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --memory 256Mi \
            --cpu 1 \
            --cpu-throttling \
            --set-env-vars "NODE_ENV=production,VITE_FIREBASE_DATABASE_ID=${VITE_FIREBASE_DATABASE_ID},VITE_FIRESTORE_COLLECTION_PREFIX=${VITE_FIRESTORE_COLLECTION_PREFIX},ENABLE_MARKETPLACE=${ENABLE_MARKETPLACE},ENABLE_GEMINI_AI=${ENABLE_GEMINI_AI}" \
            --set-secrets "GEMINI_API_KEY=2rcreations-gemini-api-key:latest"
