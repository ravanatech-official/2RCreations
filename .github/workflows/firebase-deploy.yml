name: Deploy 2R Creations to Firebase Hosting (ravanatek)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_firestore_rules:
        description: "Also deploy firestore.rules strictly to two-r-creations-db?"
        required: false
        default: false
        type: boolean

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub Secrets and Variables
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_RAVANATEK secret in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "::error::Missing VITE_FIREBASE_API_KEY or VITE_FIREBASE_APP_ID in GitHub Repository Variables/Secrets."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://2rcreations.web.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'ravanatek.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'ravanatek' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'ravanatek.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '939944415589' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || 'G-BLSD8WXRRN' }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || 'two-r-creations-db' }}
          VITE_FIRESTORE_COLLECTION_PREFIX: ${{ vars.VITE_FIRESTORE_COLLECTION_PREFIX || '' }}
          VITE_ENABLE_MARKETPLACE: ${{ vars.VITE_ENABLE_MARKETPLACE || 'false' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Deploy ONLY 2rcreations Hosting (zero sibling conflict)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          DEPLOY_RULES: ${{ github.event.inputs.deploy_firestore_rules || 'false' }}
        run: |
          CRED_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CRED_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"

          CONFIGSTORE_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/configstore"
          mkdir -p "$CONFIGSTORE_DIR"
          cat << 'EOF' > "$CONFIGSTORE_DIR/firebase-tools.json"
          {
            "apiEnablementCache": {
              "ravanatek": {
                "firebasehosting.googleapis.com": true,
                "firebase.googleapis.com": true,
                "cloudresourcemanager.googleapis.com": true
              }
            }
          }
          EOF

          DEPLOY_TARGETS="hosting:2rcreations"
          if [ "$DEPLOY_RULES" = "true" ]; then
            # firebase.json pins firestore.database = "two-r-creations-db" so sibling DBs stay untouched
            DEPLOY_TARGETS="hosting:2rcreations,firestore:rules"
          fi

          set +e
          DEPLOY_OUTPUT=$(firebase deploy --only "$DEPLOY_TARGETS" --project ravanatek --non-interactive --force 2>&1)
          DEPLOY_EXIT=$?
          set -e

          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            if echo "$DEPLOY_OUTPUT" | grep -q "is the current active version"; then
              echo "Firebase Hosting already has this exact build active. Treating as success."
              exit 0
            fi
            exit $DEPLOY_EXIT
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
